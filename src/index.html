<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Apple Mirror</title>
<style>
  :root { --bg:#0b0b0f; --card:#14141b; --line:#23232e; --text:#f2f2f7; --muted:#8e8e9a; --accent:#0a84ff; --ok:#30d158; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif; display:flex; flex-direction:column; min-height:100vh; }
  header { padding:22px 28px 8px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:-.2px; }
  .right { display:flex; align-items:center; gap:10px; }
  .status { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#555; }
  .on .dot { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  main { padding:12px 28px; display:grid; grid-template-columns:260px 1fr; gap:16px; flex:1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  label:first-child { margin-top:0; }
  input[type=text], select { width:100%; padding:9px 10px; background:#0e0e14; border:1px solid var(--line); border-radius:9px; color:var(--text); font:inherit; }
  select.small { width:auto; padding:6px 8px; font-size:13px; }
  .row { display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--text); }
  .row input { accent-color:var(--accent); }
  button { width:100%; margin-top:16px; padding:11px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:600 14px inherit; cursor:pointer; }
  button.stop { background:#ff453a; }
  button.ghost { width:auto; margin:0; padding:7px 12px; background:transparent; border:1px solid var(--line); color:var(--text); font-weight:500; font-size:13px; }
  button:hover { filter:brightness(1.08); }
  button:disabled { opacity:.5; cursor:default; }
  #log { background:#0e0e14; border:1px solid var(--line); border-radius:10px; padding:10px; height:100%; min-height:260px; overflow:auto; white-space:pre-wrap; font:12px/1.5 Consolas,monospace; color:#b8b8c4; }
  ol { margin:0 0 0 18px; padding:0; color:var(--muted); font-size:13px; }
  .tabs { display:flex; gap:6px; padding:0 28px; }
  .tab { padding:7px 14px; border-radius:9px; background:transparent; color:var(--muted); border:1px solid var(--line); cursor:pointer; width:auto; margin:0; font-weight:500; }
  .tab.active { background:var(--card); color:var(--text); }
  .hidden { display:none !important; }
  .dev { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; background:#0e0e14; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; }
  .dev small { color:var(--muted); display:block; }
  .dev button { width:auto; margin:0; padding:8px 12px; }
  .badge { font-size:12px; color:var(--ok); }
  #updBar { margin:8px 28px 0; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; }
  #updBar button { width:auto; margin:0; padding:7px 12px; }
  footer { padding:14px 28px 18px; color:var(--muted); font-size:12px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Apple Mirror</h1>
  <div class="right">
    <div class="status" id="status"><span class="dot"></span><span id="statusText"></span></div>
    <button class="ghost" id="updBtn" data-i18n="check_updates"></button>
    <select class="small" id="lang" aria-label="Language">
      <option value="ru">Русский</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </div>
</header>
<div id="updBar" class="hidden"><span id="updText"></span><span id="updActions"></span></div>
<div class="tabs" style="margin-top:10px">
  <button class="tab active" id="tabAir">AirPlay</button>
  <button class="tab" id="tabUsb">USB</button>
</div>
<main id="airView">
  <section class="card">
    <label data-i18n="name"></label>
    <input type="text" id="name" value="Apple Mirror">
    <label data-i18n="fps"></label>
    <select id="fps"><option value="30">30 fps</option><option value="60" selected>60 fps</option></select>
    <div class="row"><input type="checkbox" id="fullscreen"><span data-i18n="fullscreen"></span></div>
    <div class="row"><input type="checkbox" id="noAudio"><span data-i18n="noaudio"></span></div>
    <div class="row"><input type="checkbox" id="pin"><span data-i18n="pin"></span></div>
    <button id="toggle"></button>
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:12px;">
    <ol>
      <li data-i18n="air1"></li>
      <li data-i18n="air2"></li>
      <li data-i18n="air3"></li>
    </ol>
    <div id="log"></div>
  </section>
</main>
<main id="usbView" class="hidden" style="grid-template-columns:1fr">
  <section class="card">
    <ol>
      <li data-i18n="usb1"></li>
      <li data-i18n="usb2"></li>
    </ol>
    <div style="margin-top:14px" id="devices"></div>
    <div id="qtArea" class="hidden" style="margin-bottom:14px">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
        <button id="qtStop" class="ghost" data-i18n="usb_stop"></button>
        <span id="qtInfo" style="color:var(--muted);font-size:13px"></span>
      </div>
      <canvas id="qtCanvas" width="320" height="240" style="max-width:100%;max-height:62vh;background:#000;border-radius:10px;display:block;margin:0 auto"></canvas>
    </div>
    <div style="display:flex;gap:8px;">
      <button id="usbRefresh" style="width:auto;padding:9px 16px;" data-i18n="refresh"></button>
      <button id="usbDriver" style="width:auto;padding:9px 16px;background:#2c2c36;" data-i18n="install_driver"></button>
      <button id="usbFolder" class="ghost" style="padding:9px 14px;" data-i18n="open_zadig"></button>
    </div>
    <div id="driverHelp" class="hidden" style="margin-top:12px;color:var(--muted);font-size:13px;" data-i18n-html="driver_help"></div>
    <div id="qtLog" style="margin-top:12px;max-height:150px;overflow:auto;background:#0e0e14;border:1px solid var(--line);border-radius:10px;padding:8px;font:12px/1.5 Consolas,monospace;color:#b8b8c4;white-space:pre-wrap" class="hidden"></div>
    <div id="usbLog" style="margin-top:12px;color:var(--muted);font-size:13px;white-space:pre-wrap"></div>
  </section>
</main>
<footer><span data-i18n="footer"></span> · <span id="ver"></span></footer>
<script src="renderer.js"></script>
</body>
</html>
