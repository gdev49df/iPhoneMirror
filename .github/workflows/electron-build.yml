name: electron-build-and-release

on:
  push:
    branches: [main]
    paths:
      - 'electron-version/**'
      - '.github/workflows/electron-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uxplay:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
      - name: Diagnostics
        run: |
          pacman -Ss 'dnssd|dns_sd|mdns|bonjour' || true
          git clone --depth 1 https://github.com/FDH2/UxPlay.git
          grep -n -i -E 'dnssd|dns_sd|bonjour|WIN32|MSYS' UxPlay/CMakeLists.txt UxPlay/lib/CMakeLists.txt || true
          grep -n -i -B2 -A12 'windows' UxPlay/README.md | head -120 || true
      - name: Build UxPlay
        run: |
          cd UxPlay
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Collect exe and DLLs
        run: |
          mkdir -p /c/uxplay-out
          cp UxPlay/build/uxplay.exe /c/uxplay-out/
          ldd UxPlay/build/uxplay.exe | grep -i ucrt64 | awk '{print $3}' | xargs -I{} cp {} /c/uxplay-out/ || true
          cp -r /ucrt64/lib/gstreamer-1.0 /c/uxplay-out/ || true
          cp /ucrt64/libexec/gstreamer-1.0/gst-plugin-scanner.exe /c/uxplay-out/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: uxplay
          path: C:/uxplay-out

  app:
    needs: uxplay
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: uxplay
          path: electron-version/resources/uxplay
      - name: Download Zadig
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pbatard/libwdi --pattern 'zadig-*.exe' --dir resources/zadig
          mv resources/zadig/zadig-*.exe resources/zadig/zadig.exe
          ls -la resources/zadig
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Apple-Mirror-Setup
          path: electron-version/dist/*.exe

  release:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: Apple-Mirror-Setup
          path: out
      - id: ver
        run: echo "v=$(node -p "require('./electron-version/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Apple Mirror v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: out/*.exe
          body: |
            Apple Mirror для Windows 10/11 x64: зеркалирование экрана iPhone/iPad через AirPlay, USB-режим в разработке.
            Установщик не подписан, SmartScreen может показать предупреждение («Подробнее» → «Выполнить в любом случае»).
            Для AirPlay нужен Bonjour (ставится с iTunes или Apple Devices).
